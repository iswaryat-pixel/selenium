<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login Page</title>
<style>
body { font-family: Arial; text-align: center; padding-top: 60px; }
.login-box { background: #f0f2f5; width: 320px; margin: auto; padding: 25px; }
input, button { padding: 10px; margin: 10px; }
.error-message { color: red; }
</style>
</head>
<body>
<div class="login-box">
<h2>Student Login</h2>
<form id="loginForm">
<label for="username">Username</label><br>
<input id="username" placeholder="Enter username" required><br>
<label for="password">Password</label><br>
<input id="password" type="password" placeholder="Enter password" required><br>
<button type="submit" id="loginBtn">Login</button>
</form>
<p id="error" class="error-message"></p>
<p id="message"></p>
</div>
<script>
document.getElementById("loginForm").addEventListener("submit", function(event) {
event.preventDefault();
const username = document.getElementById("username").value;
const password = document.getElementById("password").value;
if (username === "testuser" && password === "correct-password") {
document.title = "Dashboard";
document.getElementById("message").textContent = "Dashboard - Login Successful";
document.getElementById("error").textContent = "";
} else {
document.getElementById("error").textContent = "Invalid username or password";
document.getElementById("message").textContent = "";
}
});
</script>
</body>
</html>
